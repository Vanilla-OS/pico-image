name: Vanilla Pico
id: pico
vibversion: 1.0.0

stages:
- id: build
  base: scratch
  adds:
    - srcdst:
        rootfs/vanilla-pico.tar.zst: /

  modules:
  - name: debootstrap
    type: shell
    commands:
      - /debootstrap/debootstrap --second-stage

  - name: cleanup
    type: shell
    commands:
      - rm -rf /usr/share/doc/*
      - rm -rf /usr/share/info/*
      - rm -rf /usr/share/lintian/overrides/*
      - rm -rf /usr/share/locale/*
      - rm -rf /usr/share/man/*
      - rm -rf /var/cache
      - rm -rf /var/log/*
      - mkdir -p /var/cache/apt/archives/partial

- id: dist
  base: scratch
  labels:
    maintainer: Vanilla OS Contributors
  copy:
    - from: build
      srcdst:
        /: /
  cmd:
    exec:
      - /bin/bash
